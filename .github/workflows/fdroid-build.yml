name: F-Droid Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - fix/workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate i18n strings
        run: node shared/i18n/generate-android-strings.js

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build F-Droid flavor (Debug)
        run: ./gradlew assembleFdroidDebug

      - name: Build F-Droid flavor (Release)
        run: ./gradlew assembleFdroidRelease

      - name: Rename Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk app/build/outputs/apk/fdroid/release/maripanaTokana-${{ github.ref_name }}-fdroid.apk

      - name: Update F-Droid Metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          V_CODE=$(grep "versionCode =" app/build.gradle.kts | sed 's/.*= \(.*\)/\1/')
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/maripanaTokana-${{ github.ref_name }}-fdroid.apk"
          APK_PATH="app/build/outputs/apk/fdroid/release/maripanaTokana-${{ github.ref_name }}-fdroid.apk"
          python3 scripts/update_metadata.py "$V_NAME" "$V_CODE" "$APK_URL" "$APK_PATH" "metadata/orinasa.njarasoa.maripanatokana.yml"

      - name: Commit Updated Metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/orinasa.njarasoa.maripanatokana.yml
          git commit -m "Update F-Droid metadata with binary verification for ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Push to F-Droid GitLab
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN not set, skipping GitLab update."
            exit 0
          fi
          APP_ID="orinasa.njarasoa.maripanatokana"
          GITLAB_REPO="https://oauth2:${GITLAB_TOKEN}@gitlab.com/mpilasy/fdroiddata.git"
          BRANCH="add-maripanatokana"
          
          git clone --depth 1 --branch "$BRANCH" "$GITLAB_REPO" fdroiddata_sync
          cp metadata/$APP_ID.yml fdroiddata_sync/metadata/$APP_ID.yml
          cd fdroiddata_sync
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to metadata."
          else
            git add "metadata/$APP_ID.yml"
            git commit -m "Update $APP_ID metadata (Reproducible Builds)"
            git push origin "$BRANCH"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maripanatokana-fdroid-debug-${{ github.ref_name }}.apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: maripanatokana-fdroid-release-${{ github.ref_name }}.apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/fdroid/debug/*.apk
          body: |
            # maripànaTokana ${{ github.ref_name }}

            F-Droid compatible release build.

            ## Changes
            - F-Droid flavor build (no Google Play Services)
            - Native Android LocationManager
            - 8 language support
            - Dual-unit weather display

            ## Files
            - `maripanatokana-fdroid-release-*.apk` - Release APK for F-Droid submission

            ## Testing
            See [docs/FDROID.md](https://github.com/mpilasy/maripanaTokana/blob/main/docs/FDROID.md) for technical details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
