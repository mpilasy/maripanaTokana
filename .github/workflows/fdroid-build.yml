name: F-Droid Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate i18n strings
        run: node shared/i18n/generate-android-strings.js

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build F-Droid flavor (Debug)
        run: ./gradlew assembleFdroidDebug

      - name: Build F-Droid flavor (Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            export KEYSTORE_FILE=$(pwd)/release.keystore
            ./gradlew assembleFdroidRelease
          else
            echo "KEYSTORE_BASE64 missing, building unsigned APK."
            ./gradlew assembleFdroidRelease
          fi

      - name: Update and Push Metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          
          # 1. Locate APK
          APK_PATH=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: F-Droid release APK not found"
            exit 1
          fi
          
          # 2. Extract Version Info
          V_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          V_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | sed 's/.*= \(.*\)/\1/' | tr -d '[:space:]')
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "Extracted: $V_NAME ($V_CODE) at $COMMIT_HASH"
          
          APP_ID="orinasa.njarasoa.maripanatokana"
          
          # 3. Update Local Metadata
          python3 scripts/update_metadata.py "$V_NAME" "$V_CODE" "$COMMIT_HASH" "metadata/$APP_ID.yml"
          
          # 4. Git Setup
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 5. Push to GitHub (main)
          git add metadata/$APP_ID.yml
          if ! git diff --staged --quiet; then
            git commit -m "Update F-Droid metadata for ${{ github.ref_name }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          
          # 6. Push to GitLab MR
          if [ -n "$GITLAB_TOKEN" ]; then
            GITLAB_REPO="https://oauth2:${GITLAB_TOKEN}@gitlab.com/mpilasy/fdroiddata.git"
            BRANCH="add-maripanatokana"
            git clone --depth 1 --branch "$BRANCH" "$GITLAB_REPO" fdroiddata_sync
            cp metadata/$APP_ID.yml fdroiddata_sync/metadata/$APP_ID.yml
            cd fdroiddata_sync
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet; then
              git add "metadata/$APP_ID.yml"
              git commit -m "Update $APP_ID metadata (Reproducible Builds)"
              git push origin "$BRANCH"
            fi
          fi
- name: Create Release
  if: startsWith(github.ref, 'refs/tags/')
  uses: softprops/action-gh-release@v2
  with:
    files: |
      app/build/outputs/apk/fdroid/release/*.apk
    body: |
      # maripànaTokana ${{ github.ref_name }}
      F-Droid compatible release build.
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

- name: Upload Debug APK

