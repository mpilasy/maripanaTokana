name: F-Droid Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate i18n strings
        run: node shared/i18n/generate-android-strings.js

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build F-Droid flavor (Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            export KEYSTORE_FILE=$(pwd)/release.keystore
          fi
          ./gradlew assembleFdroidRelease

      - name: RENAME AND HASH
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Could not find APK file."
            exit 1
          fi
          RENAMED_APK="app/build/outputs/apk/fdroid/release/maripanaTokana-${{ github.ref_name }}.apk"
          mv "$APK_PATH" "$RENAMED_APK"
          HASH=$(sha256sum "$RENAMED_APK" | awk '{print $1}')
          echo "APK_HASH=$HASH" >> $GITHUB_ENV
          echo "RENAMED_APK_PATH=$RENAMED_APK" >> $GITHUB_ENV
          
      - name: UPDATE METADATA AND PUSH
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          V_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          V_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | sed 's/.*= \(.*\)/\1/' | tr -d '[:space:]')
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "Extracted: $V_NAME ($V_CODE) at $COMMIT_HASH"
          APP_ID="orinasa.njarasoa.maripanatokana"
          python3 scripts/update_metadata.py "$V_NAME" "$V_CODE" "$COMMIT_HASH" "metadata/$APP_ID.yml"
          # Validate Binaries field is in the exact canonical form fdroid rewritemeta expects:
          # "Binaries: \n  URL" — the trailing space is required, its absence fails the GitLab CI.
          if ! grep -qP '^Binaries: $' "metadata/$APP_ID.yml"; then
            echo "::error::Binaries field in metadata/$APP_ID.yml is not in canonical format."
            echo "::error::Must be 'Binaries: ' (colon + space + newline), not inline or missing trailing space."
            grep "Binaries" "metadata/$APP_ID.yml" | cat -A
            exit 1
          fi
          pip install fdroidserver --quiet
          # fdroid rewritemeta is run for its own validation (a hard failure here means a
          # real schema/lint problem), but its reformatted output is NOT what gets pushed.
          # It has been observed to non-deterministically alter byte-for-byte formatting
          # (e.g. collapsing the "Binaries: " trailing-space form, re-wrapping quoted
          # block scalars) in ways that are semantically identical but fail GitLab's
          # canonical-format diff check. update_metadata.py already produces canonical
          # output, so we snapshot before rewritemeta and restore if it touched anything.
          cp "metadata/$APP_ID.yml" "metadata/$APP_ID.yml.orig"
          fdroid rewritemeta "$APP_ID"
          if ! diff -q "metadata/$APP_ID.yml.orig" "metadata/$APP_ID.yml" > /dev/null; then
            echo "Notice: fdroid rewritemeta reformatted metadata/$APP_ID.yml; discarding its formatting changes and keeping update_metadata.py's canonical output. Diff was:"
            diff "metadata/$APP_ID.yml.orig" "metadata/$APP_ID.yml" || true
            mv "metadata/$APP_ID.yml.orig" "metadata/$APP_ID.yml"
          else
            rm "metadata/$APP_ID.yml.orig"
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "metadata/$APP_ID.yml"
          if ! git diff --staged --quiet; then
            git commit -m "Update F-Droid metadata for ${{ github.ref_name }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RENAMED_APK_PATH }}
          body: |
            SHA256: ${{ env.APK_HASH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
