name: F-Droid Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate i18n strings
        run: node shared/i18n/generate-android-strings.js

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build F-Droid flavor (Debug)
        run: ./gradlew assembleFdroidDebug

      - name: Build F-Droid flavor (Release)
        run: ./gradlew assembleFdroidRelease

      - name: Rename Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk app/build/outputs/apk/fdroid/release/maripanaTokana-${{ github.ref_name }}-fdroid.apk

      - name: Update and Push Metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # 1. Extract Version Info
          V_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          V_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | sed 's/.*= \(.*\)/\1/')
          echo "Processing version: $V_NAME ($V_CODE)"
          
          # 2. Paths
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/maripanaTokana-${{ github.ref_name }}-fdroid.apk"
          APK_PATH="app/build/outputs/apk/fdroid/release/maripanaTokana-${{ github.ref_name }}-fdroid.apk"
          APP_ID="orinasa.njarasoa.maripanatokana"
          
          # 3. Update Local Metadata
          python3 scripts/update_metadata.py "$V_NAME" "$V_CODE" "$APK_URL" "$APK_PATH" "metadata/$APP_ID.yml"
          
          # 4. Git Global Config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 5. Push to GitHub (main)
          git add metadata/$APP_ID.yml
          if ! git diff --staged --quiet; then
            git commit -m "Update F-Droid metadata for ${{ github.ref_name }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Metadata already up to date on GitHub."
          fi
          
          # 6. Push to GitLab MR
          if [ -n "$GITLAB_TOKEN" ]; then
            echo "Updating F-Droid MR on GitLab..."
            GITLAB_REPO="https://oauth2:${GITLAB_TOKEN}@gitlab.com/mpilasy/fdroiddata.git"
            BRANCH="add-maripanatokana"
            
            git clone --depth 1 --branch "$BRANCH" "$GITLAB_REPO" fdroiddata_sync
            cp metadata/$APP_ID.yml fdroiddata_sync/metadata/$APP_ID.yml
            cd fdroiddata_sync
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            if ! git diff --quiet; then
              git add "metadata/$APP_ID.yml"
              git commit -m "Update $APP_ID metadata (Reproducible Builds)"
              git push origin "$BRANCH"
              echo "Successfully pushed to GitLab!"
            else
              echo "GitLab MR already up to date."
            fi
          else
            echo "GITLAB_TOKEN missing, skipping GitLab push."
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/fdroid/debug/*.apk
          body: |
            # maripànaTokana ${{ github.ref_name }}
            F-Droid compatible release build.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
