name: F-Droid Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The F-Droid build starts at the same time as our build. The VirusTotal scan
# starts when our build is done. The release job waits for all three.
jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the release notes
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release_notes.py "${{ github.ref_name }}" > dist/release_notes.md
          fi

      - name: Generate i18n strings
        run: node shared/i18n/generate-android-strings.js

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build F-Droid and standard flavors (Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            export KEYSTORE_FILE=$(pwd)/release.keystore
          fi
          ./gradlew assembleFdroidRelease assembleStandardRelease

      - name: RENAME
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Could not find APK file."
            exit 1
          fi
          cp "$APK_PATH" "dist/maripanaTokana-${{ github.ref_name }}.apk"
          # The standard APK has its own name: F-Droid's Binaries URL must point to the F-Droid APK only
          STANDARD_APK_PATH=$(find app/build/outputs/apk/standard/release -name "*.apk" | head -n 1)
          if [ -z "$STANDARD_APK_PATH" ]; then
            echo "::error::Could not find standard APK file."
            exit 1
          fi
          cp "$STANDARD_APK_PATH" "dist/maripanaTokana-standard-${{ github.ref_name }}.apk"

      - name: Upload the APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/
          if-no-files-found: error

  # F-Droid publishes a version only if its own build is the same as our
  # signed APK. This job does F-Droid's build. The release job compares.
  fdroid:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Do the F-Droid build
        run: |
          V_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          V_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | sed 's/.*= \(.*\)/\1/' | tr -d '[:space:]')
          mkdir -p fdroid-out
          scripts/fdroid_check.sh --build-only "$V_NAME" "$V_CODE" "${{ github.sha }}" fdroid-out/unsigned.apk

      - name: Upload the F-Droid APK
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-unsigned
          path: fdroid-out/unsigned.apk
          if-no-files-found: error

  # Stop the release if a VirusTotal engine says that an APK is malicious.
  scan:
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the APKs
        uses: actions/download-artifact@v8
        with:
          name: apks
          path: dist

      - name: Scan the APKs on VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python3 scripts/virustotal_check.py dist/*.apk

  release:
    needs: [build, fdroid, scan]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the APKs
        uses: actions/download-artifact@v8
        with:
          name: apks
          path: dist

      - name: Download the F-Droid APK
        uses: actions/download-artifact@v8
        with:
          name: fdroid-unsigned
          path: fdroid-out

      - name: Install fdroidserver
        run: pip install fdroidserver --quiet

      - name: Check the F-Droid build
        run: |
          python3 scripts/fdroid_compare.py "dist/maripanaTokana-${{ github.ref_name }}.apk" fdroid-out/unsigned.apk
          echo "F-Droid check passed: the F-Droid build is the same as the signed APK."

      - name: HASH
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          RENAMED_APK="dist/maripanaTokana-${{ github.ref_name }}.apk"
          STANDARD_APK="dist/maripanaTokana-standard-${{ github.ref_name }}.apk"
          echo "APK_HASH=$(sha256sum "$RENAMED_APK" | awk '{print $1}')" >> $GITHUB_ENV
          echo "RENAMED_APK_PATH=$RENAMED_APK" >> $GITHUB_ENV
          echo "STANDARD_APK_HASH=$(sha256sum "$STANDARD_APK" | awk '{print $1}')" >> $GITHUB_ENV
          echo "STANDARD_APK_PATH=$STANDARD_APK" >> $GITHUB_ENV

      - name: UPDATE METADATA AND PUSH
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          V_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          V_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | sed 's/.*= \(.*\)/\1/' | tr -d '[:space:]')
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "Extracted: $V_NAME ($V_CODE) at $COMMIT_HASH"
          APP_ID="orinasa.njarasoa.maripanatokana"
          python3 scripts/update_metadata.py "$V_NAME" "$V_CODE" "$COMMIT_HASH" "metadata/$APP_ID.yml"
          # Validate Binaries field is in the exact canonical form fdroid rewritemeta expects:
          # "Binaries: \n  URL" — the trailing space is required, its absence fails the GitLab CI.
          if ! grep -qP '^Binaries: $' "metadata/$APP_ID.yml"; then
            echo "::error::Binaries field in metadata/$APP_ID.yml is not in canonical format."
            echo "::error::Must be 'Binaries: ' (colon + space + newline), not inline or missing trailing space."
            grep "Binaries" "metadata/$APP_ID.yml" | cat -A
            exit 1
          fi
          # fdroid rewritemeta is run for its own validation (a hard failure here means a
          # real schema/lint problem), but its reformatted output is NOT what gets pushed.
          # It has been observed to non-deterministically alter byte-for-byte formatting
          # (e.g. collapsing the "Binaries: " trailing-space form, re-wrapping quoted
          # block scalars) in ways that are semantically identical but fail GitLab's
          # canonical-format diff check. update_metadata.py already produces canonical
          # output, so we snapshot before rewritemeta and restore if it touched anything.
          cp "metadata/$APP_ID.yml" "metadata/$APP_ID.yml.orig"
          fdroid rewritemeta "$APP_ID"
          if ! diff -q "metadata/$APP_ID.yml.orig" "metadata/$APP_ID.yml" > /dev/null; then
            echo "Notice: fdroid rewritemeta reformatted metadata/$APP_ID.yml; discarding its formatting changes and keeping update_metadata.py's canonical output. Diff was:"
            diff "metadata/$APP_ID.yml.orig" "metadata/$APP_ID.yml" || true
            mv "metadata/$APP_ID.yml.orig" "metadata/$APP_ID.yml"
          else
            rm "metadata/$APP_ID.yml.orig"
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "metadata/$APP_ID.yml"
          if ! git diff --staged --quiet; then
            git commit -m "Update F-Droid metadata for ${{ github.ref_name }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Write the release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            cat dist/release_notes.md
            echo
            echo "maripanaTokana-${{ github.ref_name }}.apk (F-Droid version, no Google Play Services)"
            echo "SHA256: ${{ env.APK_HASH }}"
            echo
            echo "maripanaTokana-standard-${{ github.ref_name }}.apk (standard version, uses Google Play Services for location)"
            echo "SHA256: ${{ env.STANDARD_APK_HASH }}"
          } > "$RUNNER_TEMP/release_body.md"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.RENAMED_APK_PATH }}
            ${{ env.STANDARD_APK_PATH }}
          body_path: ${{ runner.temp }}/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
