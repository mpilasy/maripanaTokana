AntiFeatures:
  TetheredNet:
    mg-MG: "Mila internet vao mandeha. Mifandray amin'ireto: api.open-meteo.com, air-quality-api.open-meteo.com
      ary geocoding-api.open-meteo.com (vinavinan'ny toetrandro, kalitaon'ny rivotra,
      fikarohana toerana); nominatim.openstreetmap.org (anaran'ny toerana); api.pirateweather.net
      (raha misafidy Pirate Weather ianao ka mampiditra ny fanalahidy API anao manokana
      ihany); ary ho an'ny fampitandremana toetrandro any amin'ny faritra tsirairay:
      api.weather.gov (Etazonia), www.nhc.noaa.gov (rivodoza), feeds.meteoalarm.org
      (Eoropa), www.jma.go.jp (Japana), api.weather.gc.ca (Kanada), api.weather.bom.gov.au
      (Aostralia) ary www.gdacs.org (loza maneran-tany). Ny koordinatan'ny toerana
      sy ny anaran-toerana karohinao ihany no alefa; tsy misy angona manokana alaina
      na zaraina."
    en-US: 'Requires internet access to function. Connects to: api.open-meteo.com,
      air-quality-api.open-meteo.com and geocoding-api.open-meteo.com (forecasts,
      air quality, place search); nominatim.openstreetmap.org (place names); api.pirateweather.net
      (only if you choose Pirate Weather and enter your own API key); and, for weather
      alerts in their regions, api.weather.gov (US), www.nhc.noaa.gov (hurricanes),
      feeds.meteoalarm.org (Europe), www.jma.go.jp (Japan), api.weather.gc.ca (Canada),
      api.weather.bom.gov.au (Australia) and www.gdacs.org (global disasters). Only
      location coordinates and the place names you search for are sent; no personal
      data is collected or shared.'
