AntiFeatures:
  TetheredNet:
    mg-MG: "Mila mamantatra zavatra amin'ny internet hamandeha azy. Ny fitohizan-tserasera
      rehetra dia azo fehezina amin'ny pejy Fikirana. Ny lalàna raikitra: api.open-meteo.com
      (vinavinan'ny toetrandro, amin'ny alàlan'ny Open-Meteo na Pirate Weather — azo
      ovaina). Ny fampandrenesana (avela tsirairay): api.weather.gov (NWS, Etazonia),
      www.gdacs.org (GDACS, maneran-tany), feeds.meteoalarm.org (MeteoAlarm, Eoropa),
      www.jma.go.jp (JMA, Japon), api.weather.gc.ca (ECCC, Kanada), api.weather.bom.gov.au
      (BOM, Aostralia), www.nhc.noaa.gov (NHC, rivodoza), severe.worldweather.wmo.int
      (WMO SWIC). Ny geocoding: nominatim.openstreetmap.org na geocoding-api.open-meteo.com
      (azo ovaina). Ny GPS ihany no ampitaina; tsy zava-pantatra momba ny mpampiasa
      alainay na zarainay."
    en-US: 'Requires internet access to function. All network connections are user-configurable
      via the Settings screen. Fixed connections: api.open-meteo.com (weather, default)
      or api.pirateweather.net (optional, user-supplied API key). Optional alert sources
      (each individually toggleable): api.weather.gov (NWS, US), www.gdacs.org (GDACS,
      global), feeds.meteoalarm.org (MeteoAlarm, Europe), www.jma.go.jp (JMA, Japan),
      api.weather.gc.ca (ECCC, Canada), api.weather.bom.gov.au (BOM, Australia), www.nhc.noaa.gov
      (NHC, tropical storms), severe.worldweather.wmo.int (WMO SWIC, global). Geocoding:
      nominatim.openstreetmap.org (default on F-Droid) or geocoding-api.open-meteo.com.
      Only GPS coordinates are transmitted; no personal data is collected or shared.'
